services:
  database:
    image: mongo:8
    container_name: database
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - todo_data:/data/db
    networks:
      - decentralized-todo-app_default

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://admin:password@database:27017/todo?authSource=admin
      SECRET_KEY: fmwe21s21wqwd
      PORT: 5000
    depends_on:
      - database
    networks:
      - decentralized-todo-app_default

  web-app:
    build: ./frontend
    container_name: web-app
    restart: always
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - decentralized-todo-app_default

networks:
  decentralized-todo-app_default:

volumes:
  todo_data: