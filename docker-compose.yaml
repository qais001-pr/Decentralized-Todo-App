services:
  database:
    image: mongo:8
    container_name: database
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    networks:
      - decentralized-todo-app_default
    volumes:
      - todo_data:/data/db

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://admin:admin@database:27017/Todo_App?authSource=admin
      SECRET_KEY: fmwe21s21wqwd
      PORT: 5000
    networks:
      - decentralized-todo-app_default
    depends_on:
      - database

  web-app:
    build: ./frontend
    container_name: web-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000
    networks:
      - decentralized-todo-app_default
    depends_on:
      - backend

networks:
  decentralized-todo-app_default:

volumes:
  todo_data: